[package]
name = "quantpilot-quant"
version = "0.1.0"
edition = "2021"
description = "QuantPilot 量化助手后端（Rust）"
license = "MIT"

[lib]
name = "quantpilot_quant"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
