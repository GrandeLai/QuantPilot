[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quantpilot-quant"
version = "0.1.0"
description = "QuantPilot 量化助手后端（Rust + PyO3 binding for transitional use; Phase B 起改纯 axum 服务）"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "quantpilot_quant"
features = ["pyo3/extension-module"]
