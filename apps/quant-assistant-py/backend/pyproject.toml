[project]
name = "quantpilot-quant"
version = "0.1.0"
description = "QuantPilot 量化助手 Python 临时态后端（Phase A 过渡，Step 4 删除）：回测、因子、ML、信号、策略、优化、研究"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "quantpilot-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "loguru>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pandas-ta>=0.3.0b0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "cvxpy>=1.5.0",
    "statsmodels>=0.14.0",
    "ta>=0.11.0",
    "aiosqlite>=0.20.0",
    "optuna>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot_quant"]

[tool.uv]
package = true

[tool.uv.sources]
quantpilot-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
