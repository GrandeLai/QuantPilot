[project]
name = "quantpilot-golden"
version = "0.1.0"
description = "QuantPilot Golden dataset generator (Phase A skeleton; Phase B+ implements case logic)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "quantpilot-common",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "onnx>=1.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot_golden"]

[tool.uv]
package = true

[tool.uv.sources]
quantpilot-common = { workspace = true }

[project.scripts]
golden-generator = "quantpilot_golden.cli:main"
