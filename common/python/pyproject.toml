[project]
name = "quantpilot-common"
version = "0.1.0"
description = "QuantPilot 共享 Python 基础设施：config、redis、platform、plugins、data fetchers、生成的 schema 类型"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.0",
    "redis>=5.0.0",
    "duckdb>=1.1.0",
    "polars>=0.20.0",
    "yfinance>=0.2.40",
    "akshare>=1.13.0",
    "pyarrow>=15.0.0",
    "pluggy>=1.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "apscheduler>=3.10.0",
    "gitpython>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantpilot_common"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# 排除 codegen 生成的 schemas/ 目录（confloat/conint 旧式用法由 datamodel-codegen 输出）
exclude = ["quantpilot_common/schemas/"]

[[tool.mypy.overrides]]
# gitpython 无类型 stubs，忽略属性访问错误
module = "git.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# redis.asyncio stubs 存在 Awaitable[T] | T 联合类型，mypy 无法处理
module = "redis.*"
ignore_missing_imports = true

