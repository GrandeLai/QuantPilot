[project]
name = "quantpilot"
version = "0.1.0"
description = "QuantPilot — 本地优先的个人量化交易平台"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "loguru>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "duckdb>=1.1.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "typer>=0.12.0",
    "apscheduler>=3.10.0",
    "pluggy>=1.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiofiles>=23.0.0",
    # Phase 1 — 数据模块
    "yfinance>=0.2.50",
    "akshare>=1.14.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    # Phase 3 — 因子/期权/优化/组合
    "optuna>=3.6.0",
    "scipy>=1.13.0",
    # Phase 4 — ML 策略
    "lightgbm>=4.0.0",
    "scikit-learn>=1.5.0",
    "vaderSentiment>=3.3.2",
    # Redis
    "redis[asyncio]>=5.0.0",
    # Phase 1 — 安全
    "cryptography>=42.0.0",
    "pyarrow>=15.0.0",
    "jinja2>=3.1.0",
    "gitpython>=3.1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "maturin>=1.5.0",
    "fakeredis>=2.26.0",
]

[project.scripts]
quantpilot = "quantpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quantpilot"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
